[project]
name = "comfyui-intel-arc-xpu"
description = "Speed up ComfyUI and prevent Out-of-Memory crashes on Intel Arc graphics cards (Windows). Adds plug-and-play Intel GPU acceleration (XPU) + DynamicVRAM with no core edits. Note: Registry installs require a one-time wheel setup (.\\install.ps1 / install.py on Python 3.13 + torch==2.13.0+xpu) and --enable-dynamic-vram --reserve-vram 1 (or 2 with display); read https://github.com/wildersa/ComfyUI-Intel-Arc-XPU first."
version = "0.2.9"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
keywords = ["comfyui", "intel", "intel-arc", "intel-gpu", "xpu", "bmg", "dynamicvram", "omnixpu"]

[project.urls]
Repository = "https://github.com/wildersa/ComfyUI-Intel-Arc-XPU"
Documentation = "https://github.com/wildersa/ComfyUI-Intel-Arc-XPU#readme"
Issues = "https://github.com/wildersa/ComfyUI-Intel-Arc-XPU/issues"

[tool.comfy]
PublisherId = "wildersa"
DisplayName = "ComfyUI Intel Arc XPU (OmniXPU Windows)"
