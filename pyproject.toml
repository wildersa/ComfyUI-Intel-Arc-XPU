[project]
name = "comfyui-intel-arc-xpu"
description = "MANDATORY: Read the full README at https://github.com/wildersa/ComfyUI-Intel-Arc-XPU before using. Installing via Comfy Registry alone is incomplete — this extension only works properly with Python 3.13 + torch==2.13.0+xpu, the extra native Windows XPU wheel setup step (.\\install.ps1 / install.py), and --enable-dynamic-vram --reserve-vram 1 (or 2 with display)."
version = "0.2.6"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
keywords = ["comfyui", "intel", "arc", "xpu", "bmg", "dynamicvram", "omnixpu"]

[project.urls]
Repository = "https://github.com/wildersa/ComfyUI-Intel-Arc-XPU"
Documentation = "https://github.com/wildersa/ComfyUI-Intel-Arc-XPU#readme"
Issues = "https://github.com/wildersa/ComfyUI-Intel-Arc-XPU/issues"

[tool.comfy]
PublisherId = "wildersa"
DisplayName = "ComfyUI Intel Arc XPU (OmniXPU Windows)"
