[project]
name = "comfyui-intel-arc-xpu"
description = "MANDATORY: Read the full README at https://github.com/wildersa/ComfyUI-Intel-Arc-XPU before using. New Comfy Registry installs require a one-time native Windows XPU wheel setup (.\\install.ps1 / install.py on Python 3.13 + torch==2.13.0+xpu) and --enable-dynamic-vram --reserve-vram 1 (or 2 with display). Updating from v0.2.x only requires updating this node and restarting ComfyUI — no wheel reinstall needed."
version = "0.2.8"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
keywords = ["comfyui", "intel", "arc", "xpu", "bmg", "dynamicvram", "omnixpu"]

[project.urls]
Repository = "https://github.com/wildersa/ComfyUI-Intel-Arc-XPU"
Documentation = "https://github.com/wildersa/ComfyUI-Intel-Arc-XPU#readme"
Issues = "https://github.com/wildersa/ComfyUI-Intel-Arc-XPU/issues"

[tool.comfy]
PublisherId = "wildersa"
DisplayName = "ComfyUI Intel Arc XPU (OmniXPU Windows)"
