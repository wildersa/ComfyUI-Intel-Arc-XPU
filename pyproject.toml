[project]
name = "comfyui-intel-arc-xpu"
description = "Native Intel Arc Battlemage (B70 / XPU) acceleration for ComfyUI on Windows (ComfyUI-OmniXPU adapters and diagnostics). Comfy Registry installs require one extra setup step for native XPU binaries plus --enable-dynamic-vram --reserve-vram 1 (or 2 with display); see README. Benchmarks in the repository."
version = "0.2.4"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
keywords = ["comfyui", "intel", "arc", "xpu", "bmg", "dynamicvram", "omnixpu"]

[project.urls]
Repository = "https://github.com/wildersa/ComfyUI-Intel-Arc-XPU"
Documentation = "https://github.com/wildersa/ComfyUI-Intel-Arc-XPU#readme"
Issues = "https://github.com/wildersa/ComfyUI-Intel-Arc-XPU/issues"

[tool.comfy]
PublisherId = "wildersa"
DisplayName = "ComfyUI Intel Arc XPU (OmniXPU Windows)"
